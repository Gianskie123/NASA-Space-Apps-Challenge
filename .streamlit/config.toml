# Light theme for projectors, printouts and government readers (tokens mirrored in app/ui.py).
[theme]
base = "light"
primaryColor = "#1f5fbf"
backgroundColor = "#f6f6f3"
secondaryBackgroundColor = "#efefea"
textColor = "#1b2230"
borderColor = "#e1e1da"
baseRadius = "medium"

[client]
toolbarMode = "minimal"
# Security: visitors see a generic message on an error; tracebacks, local paths and exception text stay in
# the server log only.
showErrorDetails = "none"
showSidebarNavigation = false

[browser]
gatherUsageStats = false


[server]
# Streamlit's default, stated so it is not switched off by accident.
enableXsrfProtection = true
