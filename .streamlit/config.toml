# Dark navy theme (AviLight palette), Hallmark rules: no pure white text, one accent.
[theme]
base = "dark"
primaryColor = "#4f8ff7"
backgroundColor = "#0f1117"
secondaryBackgroundColor = "#1a1d23"
textColor = "#e8eaef"
borderColor = "#2c313b"
baseRadius = "medium"

[theme.sidebar]
backgroundColor = "#1a1d23"
secondaryBackgroundColor = "#21252d"

[client]
toolbarMode = "minimal"
# Security: visitors see a generic message on an error; tracebacks, local paths and exception text stay in
# the server log only.
showErrorDetails = "none"

[browser]
gatherUsageStats = false


[server]
# Streamlit's default, stated so it is not switched off by accident.
enableXsrfProtection = true
